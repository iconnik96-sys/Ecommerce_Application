services:
  - type: web
    name: luminary-backend
    runtime: docker
    rootDir: Ecommerce-Backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        fromDatabase:
          name: luminary-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: meta-llama/llama-4-scout-17b-16e-instruct
      - key: FRONTEND_URL
        sync: false

databases:
  - name: luminary-db
    databaseName: ecommerce_db
    user: ecommerce_user
    plan: free
