spring.application.name=Ecommerce-Backend

spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/ecommerce_db}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# 'update' = safe for first deploy; change to 'validate' after tables are created
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=${PORT:8080}

# JWT
jwt.secret=${JWT_SECRET:mysecretkeymysecretkeymysecretkey123456}

# Groq AI
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:meta-llama/llama-4-scout-17b-16e-instruct}
groq.timeout.ms=${GROQ_TIMEOUT_MS:15000}
groq.max.retries=${GROQ_MAX_RETRIES:2}